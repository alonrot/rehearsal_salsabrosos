<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rehearsal availability</title>

<link rel="icon" href="favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">

<!-- Link previews (WhatsApp, iMessage, Slack, Signal...).
     og:image MUST be an absolute URL - WhatsApp silently ignores a relative one.
     1200x630 and under 300KB is what gets the large card rather than a thumbnail. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Los Salsabrosos">
<meta property="og:title" content="Rehearsal availability">
<meta property="og:description" content="Paint the half-hour blocks you are free. Takes a minute on your phone.">
<meta property="og:url" content="https://salsabrosos-rehearsal.netlify.app/">
<meta property="og:image" content="https://salsabrosos-rehearsal.netlify.app/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Los Salsabrosos - rehearsal availability">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#0b1020; --panel:#141b30; --line:#222c4d; --line2:#32406b;
    --ink:#f2f4f8; --dim:#9fa9c4; --faint:#6b7694;
    --accent:#4257c9; --accent2:#5a6fe0;
    --sel:#2fbf71; --sel2:#53e193;
    --tw:62px; --hh:48px; --rh:30px; --cw:66px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
  }
  #app{height:100%; height:100dvh; display:flex; flex-direction:column; max-width:900px; margin:0 auto;}

  /* ---------- top ---------- */
  #brand{flex:none; text-align:center; padding:10px 14px 2px;}
  #brand img{height:42px; width:auto; max-width:92%; object-fit:contain; display:inline-block;}
  @media (max-height:460px){ #brand{display:none;} }

  #gigbar{flex:none; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:4px 14px 0;}
  #gigbar:empty{display:none;}
  #gigbar button{
    padding:6px 14px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); color:var(--dim);
    font-size:13px; font-weight:600; font-family:inherit; white-space:nowrap;
  }
  #gigbar button[aria-pressed=true]{background:var(--accent); color:#fff; border-color:var(--accent);}
  #gigbar .note{font-size:12px; color:var(--faint); padding:4px 0;}
  #maracas{height:34px; width:auto; flex:none; display:block;}
  #top{padding:8px 14px 8px; flex:none;}
  .row{display:flex; gap:8px; align-items:center;}
  input[type=text]{
    flex:1; min-width:0; padding:9px 12px; font-size:16px; border-radius:11px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
  }
  input[type=text]:focus{outline:none; border-color:var(--accent);}
  /* ---------- who are you? ---------- */
  #whorow{flex:none; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:4px 14px 0;}
  #whorow:empty{display:none;}
  #whorow .lbl{width:100%; margin:0; font-size:12px; color:var(--faint);}
  #whorow button{
    padding:6px 12px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); color:var(--dim);
    font-size:13px; font-weight:600; font-family:inherit; white-space:nowrap;
  }
  #whorow button.me{background:var(--accent); color:#fff; border-color:var(--accent);}
  #whorow button.pending{opacity:.55; border-style:dashed;}   /* on the list, not answered yet */
  #whorow button.add{color:var(--ink); border-style:dashed;}
  #whorow.locked button{opacity:.4; pointer-events:none;}
  #whorow .chg{font-size:12px; color:var(--faint); text-decoration:underline;}
  #whook{flex:none; padding:9px 14px; border:0; border-radius:11px; background:var(--accent);
         color:#fff; font-size:14px; font-weight:650; font-family:inherit;}
  #nmatch{margin:8px 0 0; padding:9px 11px; border-radius:11px;
          background:var(--panel); border:1px solid var(--line2);
          display:flex; flex-wrap:wrap; gap:6px;}
  #nmatch p{width:100%; margin:0 0 2px; font-size:12.5px; color:var(--ink); line-height:1.4;}
  #nmatch button{padding:6px 12px; border:0; border-radius:999px; background:var(--accent);
                 color:#fff; font-size:12.5px; font-weight:600; font-family:inherit;}
  #nmatch button.ghost{background:transparent; border:1px solid var(--line2); color:var(--dim);}
  /* an author display: rule beats the [hidden] attribute, so say it explicitly */
  #nmatch[hidden], #who[hidden], #whook[hidden]{display:none;}

  .hint{margin:7px 0 0; font-size:12px; color:var(--faint); display:flex; justify-content:space-between; gap:8px;}
  #sync{flex:none;}
  #sync.bad{color:#e8a53c;}

  /* ---------- grid viewport ---------- */
  #vp{
    position:relative; flex:1; min-height:0; overflow:hidden;
    touch-action:none; cursor:crosshair;
    border-top:1px solid var(--line);
    user-select:none; -webkit-user-select:none;
  }
  #vp>div{position:absolute; will-change:transform;}
  #corner{left:0; top:0; width:var(--tw); height:var(--hh); z-index:3;
    background:var(--bg); border-right:1px solid var(--line2); border-bottom:1px solid var(--line2);}
  #dayhdr{left:var(--tw); top:0; height:var(--hh); z-index:2; display:flex;
    background:var(--bg); border-bottom:1px solid var(--line2);}
  .dh{width:var(--cw); flex:none; text-align:center; padding-top:7px; border-right:1px solid var(--line); overflow:hidden;}
  .dh b{display:block; font-size:13px; font-weight:650;}
  .dh span{font-size:11px; color:var(--faint);}
  #timecol{left:0; top:var(--hh); width:var(--tw); z-index:2;
    background:var(--bg); border-right:1px solid var(--line2);}
  /* rows can be ~12px tall now that the default view spans all of 9am-11pm,
     so the label has to fit in that: 10px text + 1px padding + line-height 1. */
  .tl{height:var(--rh); font-size:10px; line-height:1; color:var(--dim); text-align:right;
      padding:1px 8px 0 0; font-variant-numeric:tabular-nums; overflow:hidden;}
  .tl.half{color:transparent;}
  #cells{left:var(--tw); top:var(--hh); z-index:1; display:grid;}
  .c{
    width:var(--cw); height:var(--rh);
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:rgba(242,244,248,.78); font-variant-numeric:tabular-nums;
    overflow:hidden;
  }
  .c.hr{border-top:1px solid var(--line2);}
  body.me .c.on{background:linear-gradient(180deg,var(--sel),var(--sel2));
    border-right-color:rgba(0,0,0,.25); border-bottom-color:rgba(0,0,0,.18); color:#0b1020;}

  /* tooltip */
  #tip{
    z-index:5; max-width:250px; padding:8px 11px; border-radius:11px;
    background:#242b3a; border:1px solid var(--line2); box-shadow:0 6px 24px rgba(0,0,0,.5);
    font-size:12.5px; line-height:1.45; color:var(--ink); pointer-events:none;
    display:none; will-change:auto;
  }
  #tip b{display:block; font-size:11.5px; color:var(--dim); margin-bottom:2px; font-weight:600;}
  #tip .yes{display:block;}
  #tip .no{display:block; margin-top:5px; padding-top:5px;
           border-top:1px solid var(--line2); color:var(--faint);}

  /* ---------- bottom ---------- */
  #bot{flex:none; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--bg);}
  #count{font-size:13px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums;}
  #mainbtn{flex:0 1 auto; min-width:0; padding:13px 16px; border:0; border-radius:12px;
    font-size:15.5px; font-weight:650; font-family:inherit; background:var(--accent); color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mainbtn:disabled{background:#222c4d; color:var(--faint);}
  #discardbtn{flex:none; margin-left:auto; padding:13px 16px; border:1px solid var(--line2);
    border-radius:12px; background:var(--panel); color:var(--dim);
    font-size:15px; font-weight:600; font-family:inherit; white-space:nowrap;}
  #mainbtn[hidden], #discardbtn[hidden]{display:none;}
  /* Fills the grid area while the gig list loads, and doubles as the no-JS
     fallback. position/inset are needed because #vp>div makes it absolute with
     no box, and z-index must beat #corner (3) or that top-left block paints
     over the text. */
  #nojs{
    position:absolute; inset:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:18px 16px; text-align:center;
    background:var(--bg); color:var(--dim); font-size:14px; line-height:1.5;
  }
  #nojs img{height:64px; width:auto;}
  #nojs .lbl{font-size:14px; color:var(--faint);}
  @keyframes pulse{0%,100%{opacity:.55; transform:scale(.96);} 50%{opacity:1; transform:scale(1);}}
  #nojs.loading img{animation:pulse 1.25s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ #nojs.loading img{animation:none; opacity:.9;} }
</style>
</head>
<body class="group">

<div id="app">
  <div id="brand"><img alt="Salsabrosos" src="logo.png" width="418" height="96"></div>
  <div id="gigbar"></div>

  <div id="whorow"></div>

  <div id="top">
    <div class="row">
      <img id="maracas" alt="" src="maracas.png" width="94" height="72">
      <input type="text" id="who" placeholder="Your name" autocomplete="off" autocapitalize="words" enterkeyhint="done" hidden>
      <button id="whook" type="button" hidden>OK</button>
    </div>
    <div id="nmatch" hidden></div>
    <p class="hint"><span id="hint"></span><span id="sync"></span></p>
  </div>

  <div id="vp">
    <div id="nojs">
      ⚠️ The grid needs JavaScript, which isn't running here. You're probably in a file
      preview (iOS Files / Quick Look / mail / Drive). Open the page in Safari or Chrome.
    </div>
    <div id="cells"></div>
    <div id="dayhdr"></div>
    <div id="timecol"></div>
    <div id="corner"></div>
    <div id="tip"></div>
  </div>

  <div id="bot">
    <span id="count"></span>
    <button id="mainbtn" hidden>…</button>
    <button id="discardbtn" type="button" hidden>Discard</button>
  </div>
</div>

<script>
/* ================= CONFIG — edit per poll ================= */
/* Where are we running? localhost/LAN -> server.py.  Anything else (Netlify) -> Apps Script. */
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+)$/
                .test(location.hostname);
const EXEC_URL = "https://script.google.com/macros/s/AKfycbxGwJZlvFDokPpRwFAD6d9rWfUGvqkPSHmrTnVjTxC7ZfcSbn13p11d-uIqhY_o8KgT/exec";

const CONFIG = {
  dates: [
    "2026-10-07","2026-10-10","2026-10-11",
    "2026-10-14","2026-10-17","2026-10-18",
    "2026-10-21","2026-10-24","2026-10-25",
    "2026-10-28","2026-10-31","2026-11-01"
  ],
  startHour: 9, endHour: 23, slotMinutes: 30,
  defaultDaysVisible: 8,     // default view: 8 columns ...
  defaultHoursVisible: 14,   // ... and the whole 9am-11pm vertically
  zoomInDaysCap: 6,          // pinch in  -> at most 6 days across
  zoomOutDaysCap: 9,         // pinch out -> at most 9 days across
  // LOCAL is computed just above: no editing this file between environments.
  apiBase: LOCAL ? "" : EXEC_URL,
  pollMs:  LOCAL ? 2000 : 8000   // Apps Script has daily quotas; don't poll it hard
};
/* =========================================================== */

/* ---------- which gig are we filling in? ----------
   The gig list lives in the Sheet (tab "gigs"), so adding a gig is one new row
   there - no code change, no deploy. It has to be fetched BEFORE the grid is
   built, because CONFIG.dates decides the grid's shape and that happens once.
   Switching gig reloads with ?gig=<id> instead of rebuilding the grid. */
const GIGS_URL = () => CONFIG.apiBase ? CONFIG.apiBase + "?what=gigs"
                                      : "data.json?what=gigs";
const remember = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const recall   = k      => { try{ return localStorage.getItem(k); }catch(e){ return null; } };

function renderGigBar(gigs, currentId){
  const bar = document.getElementById("gigbar");
  bar.innerHTML = "";
  for (const g of gigs){
    const b = document.createElement("button");
    b.textContent = g.label || g.id;
    b.setAttribute("aria-pressed", String(g.id === currentId));
    b.onclick = () => {
      if (g.id === currentId) return;          // already showing this one
      remember("gig", g.id);
      location.search = "?gig=" + encodeURIComponent(g.id);
    };
    bar.appendChild(b);
  }
}

async function boot(){
  const nojs = document.getElementById("nojs");
  if (nojs){                                     // the gig fetch takes ~2s on Apps Script
    nojs.className = "loading";
    nojs.innerHTML = '<img src="maracas.png" width="94" height="72" alt="">'
                   + '<div class="lbl">Loading\u2026</div>';
  }
  let gigs = [];
  try{
    const res = await fetch(GIGS_URL(), {cache:"no-store"});
    if (res.ok) gigs = (await res.json()).gigs || [];
  }catch(e){ /* leave gigs empty; CONFIG.dates below is the fallback */ }

  if (gigs.length){
    const want = new URLSearchParams(location.search).get("gig") || recall("gig");
    const gig  = gigs.find(g => g.id === want) || gigs[0];
    CONFIG.gigId = gig.id;
    if (gig.dates && gig.dates.length) CONFIG.dates = gig.dates;
    if (gig.startHour != null) CONFIG.startHour = gig.startHour;
    if (gig.endHour   != null) CONFIG.endHour   = gig.endHour;
    document.title = gig.label + " \u2014 availability";
    remember("gig", gig.id);
    renderGigBar(gigs, gig.id);
  } else {
    const bar = document.getElementById("gigbar");
    if (bar) bar.innerHTML = '<span class="note">No gig set up yet</span>';
  }
  startApp();
}

function startApp(){

const ND = CONFIG.dates.length;
const NR = ((CONFIG.endHour - CONFIG.startHour) * 60) / CONFIG.slotMinutes;
const sel = CONFIG.dates.map(() => new Array(NR).fill(false));

const pad = n => String(n).padStart(2,"0");
const slotTime = i => { const m = CONFIG.startHour*60 + i*CONFIG.slotMinutes; return pad(m/60|0)+":"+pad(m%60); };
const slotIdx = hhmm => { const [h,m]=hhmm.split(":").map(Number); return ((h*60+m)-CONFIG.startHour*60)/CONFIG.slotMinutes; };
const label12 = hhmm => { let [h,m]=hhmm.split(":").map(Number); const ap=h>=12?"pm":"am"; h=h%12||12; return m?`${h}:${pad(m)}${ap}`:`${h}${ap}`; };
const norm = s => s.trim().toLowerCase();

const $ = id => document.getElementById(id);
const vp=$("vp"), cellsEl=$("cells"), hdrEl=$("dayhdr"), tcolEl=$("timecol"), tip=$("tip");
$("nojs").remove();

/* ---- build DOM ---- */
CONFIG.dates.forEach(iso => {
  const dt = new Date(iso+"T12:00:00");
  const d = document.createElement("div");
  d.className = "dh";
  d.innerHTML = `<b>${dt.toLocaleDateString(undefined,{weekday:"short"})}</b><span>${dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>`;
  hdrEl.appendChild(d);
});
for (let r=0;r<NR;r++){
  const t = document.createElement("div");
  t.className = "tl" + (slotTime(r).endsWith(":00")?"":" half");
  t.textContent = label12(slotTime(r));
  tcolEl.appendChild(t);
}
const cellEls = [];
for (let r=0;r<NR;r++) for (let c=0;c<ND;c++){
  const el = document.createElement("div");
  el.className = "c" + (slotTime(r).endsWith(":00") && r ? " hr":"");
  cellsEl.appendChild(el);
  cellEls[r*ND+c] = el;
}
cellsEl.style.gridTemplateColumns = `repeat(${ND}, var(--cw))`;

/* ---- geometry: base sizes x zoom factor Z ---- */
let TW=62, HH=48, vpW=0, vpH=0;
let CW0=66, RH0=30, Z=1, CW=66, RH=30;
let panX=0, panY=0;
const rowsDefault = CONFIG.defaultHoursVisible*60/CONFIG.slotMinutes;

function zBounds(){
  // Visible days = defaultDaysVisible / Z, so both caps are plain ratios.
  // (The old cap was "stop when all rows fit". That is useless now the default
  //  view already spans the whole 9am-11pm: it computes to exactly Z=1 and
  //  would block zooming out at all.)
  const zOut    = CONFIG.defaultDaysVisible/CONFIG.zoomOutDaysCap;  // most zoomed out
  const zIn     = CONFIG.defaultDaysVisible/CONFIG.zoomInDaysCap;   // most zoomed in
  const legible = Math.max(29/CW0, 9/RH0);         // never shrink cells past this
  return [Math.min(1, Math.max(zOut, legible)), Math.max(1, zIn)];
}
function setSizes(){
  CW = CW0*Z; RH = RH0*Z;
  document.documentElement.style.setProperty("--cw", CW+"px");
  document.documentElement.style.setProperty("--rh", RH+"px");
}
function layout(){
  const r = vp.getBoundingClientRect(); vpW=r.width; vpH=r.height;
  CW0 = Math.max(40, (vpW-TW)/CONFIG.defaultDaysVisible);   // 58 here capped a phone at ~6 days
  RH0 = Math.max(12, (vpH-HH)/rowsDefault);   // 20 here hid the evening behind a pan
  const [a,b]=zBounds(); Z=Math.min(b,Math.max(a,Z));
  setSizes(); clampPan(); applyPan();
}
function clampPan(){
  panX = Math.min(0, Math.max(vpW - TW - ND*CW, panX));
  panY = Math.min(0, Math.max(vpH - HH - NR*RH, panY));
  if (ND*CW <= vpW-TW) panX=0;
  if (NR*RH <= vpH-HH) panY=0;
}
function applyPan(){
  cellsEl.style.transform = `translate(${panX}px,${panY}px)`;
  hdrEl.style.transform   = `translateX(${panX}px)`;
  tcolEl.style.transform  = `translateY(${panY}px)`;
  hideTip();
}
/* zoom so the content point under (mx,my) stays put */
function zoomAt(zNew, mx, my){
  const [a,b]=zBounds(); zNew=Math.min(b,Math.max(a,zNew));
  if (zNew===Z) return;
  const rect=vp.getBoundingClientRect();
  const ux=(mx-rect.left-TW-panX)/CW, uy=(my-rect.top-HH-panY)/RH;
  Z=zNew; setSizes();
  panX = mx-rect.left-TW-ux*CW;
  panY = my-rect.top -HH-uy*RH;
  clampPan(); applyPan();
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout,120));
new ResizeObserver(layout).observe(vp);   // vp height changes without a window resize too

/* ---- data layer ---- */
let group = [];
let counts = [];
let groupStamp = "";
let maxN = 1;
const gigQ = () => "?gig=" + encodeURIComponent(CONFIG.gigId || "");
const GET_URL  = () => (CONFIG.apiBase ? CONFIG.apiBase : "data.json") + gigQ();
const POST_URL = () => CONFIG.apiBase ? CONFIG.apiBase : "submit";   // gig travels in the body

function rebuildCounts(){
  counts = CONFIG.dates.map(()=>Array.from({length:NR},()=>[]));
  maxN = 1;
  for (const resp of group){
    const av = resp.availability || {};
    CONFIG.dates.forEach((iso,c) => {
      for (const rng of (av[iso]||[])){
        const [a,b] = rng.split("-");
        let r0 = Math.max(0, Math.floor(slotIdx(a)));
        let r1 = Math.min(NR, Math.ceil(slotIdx(b)));
        for (let r=r0; r<r1; r++){
          counts[c][r].push(resp.name);
          if (counts[c][r].length > maxN) maxN = counts[c][r].length;
        }
      }
    });
  }
}
async function fetchData(){
  if (document.hidden) return;
  try{
    const res = await fetch(GET_URL(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const stamp = JSON.stringify(data);
    setSync(true);
    if (stamp === groupStamp) return;
    groupStamp = stamp;
    group = data.responses || [];
    rebuildCounts();
    if (view==="group") renderCells();
    refreshBar();
    maybeLoadMine();
    renderWho();                       // someone new may have answered since last poll
  }catch(err){ setSync(false); }
}
let online=null;
function setSync(ok){
  if (ok===online) return;
  online=ok;
  const s=$("sync");
  s.textContent = ok ? "" : "⚠ no server — nothing is saved";
  s.className = ok ? "" : "bad";
}

/* ---- my availability <-> name field ---- */
let loadedFor = "", gridDirty = false, editing = false;
const findResp = name => group.find(r => norm(r.name||"")===name);

function clearSel(){ for (const col of sel) col.fill(false); }

function maybeLoadMine(force){
  const name = norm($("who").value);
  if (!name || gridDirty || (name===loadedFor && !force)) return;
  const mine = findResp(name);
  if (!mine) return;
  loadedFor = name;
  clearSel();
  CONFIG.dates.forEach((iso,c) => {
    for (const rng of ((mine.availability||{})[iso]||[])){
      const [a,b] = rng.split("-");
      for (let r=Math.max(0,slotIdx(a)); r<Math.min(NR,slotIdx(b)); r++) sel[c][r]=true;
    }
  });
  gridDirty = false;
  if (view==="me") renderCells();
  refreshBar();
}

/* the moment the name stops matching anyone, show Everyone */
$("who").addEventListener("input", () => {
  refreshBar();
  if (editing) return;                      // never yank the grid mid-edit
  const name = norm($("who").value);
  if (name && findResp(name)){
    loadedFor=""; gridDirty=false; maybeLoadMine(true);
  } else {
    clearSel(); loadedFor=""; gridDirty=false;
    if (view!=="group") setView("group"); else renderCells();
    refreshBar();
  }
});

/* ---------- who are you? ----------
   The name field is the single source of truth for everything else (loading your
   grid, the submit payload, the button state). These chips just drive it, so the
   safe path is a tap and typing is the deliberate exception. Chips come from the
   gig's optional "people" list in the Sheet, plus anyone who has already answered. */
let picked = "", pendingConfirm = false;

const nkey = x => String(x||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
                  .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function knownPeople(){
  const answered = new Map();
  group.forEach(r => answered.set(nkey(r.name), r.name));
  const out = [], seen = new Set();
  (CONFIG.people || []).forEach(n => {                 // pre-listed, in the Sheet's order
    const k = nkey(n);
    if (!k || seen.has(k)) return;
    seen.add(k);
    out.push({ name: answered.get(k) || n, pending: !answered.has(k) });
  });
  group.forEach(r => {                                 // anyone else who has answered
    const k = nkey(r.name);
    if (!k || seen.has(k)) return;
    seen.add(k);
    out.push({ name: r.name, pending: false });
  });
  return out;
}

/* Only ever used to ASK - never to merge two people silently. */
function looksLikeSameName(a, b){
  if (a === b) return true;
  if (a.startsWith(b + " ") || b.startsWith(a + " ")) return true;   // skye / skye ocaranza
  const fa = a.split(" ")[0], fb = b.split(" ")[0];
  if (fa === fb) return true;                                        // john / john gefroh
  if (fa.length >= 3 && (fb.startsWith(fa) || fa.startsWith(fb))) return true;  // anu / anushka
  return false;
}

function showNameInput(on){
  $("who").hidden = !on;
  $("whook").hidden = !on;
  $("nmatch").hidden = true;
  pendingConfirm = false;
  if (on){ $("who").value = ""; refreshBar(); $("who").focus(); }
}

function selectIdentity(name){
  picked = name;
  pendingConfirm = false;
  $("who").value = name;
  $("who").dispatchEvent(new Event("input"));   // reuse the existing load-their-grid path
  showNameInput(false);
  renderWho();
  setView("me");                                 // read-only: painting needs `editing`
}

function renderWho(){
  const row = $("whorow");
  if (editing) return;                      // frozen while painting
  row.innerHTML = "";

  const people = knownPeople();
  if (picked && !people.some(x => nkey(x.name) === nkey(picked)))
    people.push({ name: picked, pending: true });   // typed just now, not submitted yet

  const l = document.createElement("p");
  l.className = "lbl";
  l.textContent = picked ? "Showing " + picked + " \u00b7 tap again for everyone"
                         : "Tap a name to see their slots";
  row.appendChild(l);

  people.forEach(pp => {
    const b = document.createElement("button");
    b.textContent = pp.name;
    const on = picked && nkey(pp.name) === nkey(picked);
    b.className = on ? "me" : (pp.pending ? "pending" : "");
    b.onclick = () => on ? deselect() : selectIdentity(pp.name);
    row.appendChild(b);
  });

  const add = document.createElement("button");
  add.className = "add"; add.textContent = "+ I'm new";
  add.onclick = () => showNameInput(true);
  row.appendChild(add);
}

function commitTypedName(){
  const raw = $("who").value.trim();
  if (raw.length < 2) return;
  const k = nkey(raw), people = knownPeople();
  const exact = people.find(x => nkey(x.name) === k);
  if (exact) return selectIdentity(exact.name);             // same person, canonical spelling
  const near = people.filter(x => looksLikeSameName(k, nkey(x.name)));
  if (near.length) return askNearMatch(raw, near);
  selectIdentity(raw);
}

function askNearMatch(typed, near){
  const el = $("nmatch");
  el.innerHTML = "";
  const q = document.createElement("p");
  q.textContent = near.length === 1
    ? "Someone already answered as \u201c" + near[0].name + "\u201d. Is that you?"
    : "These people already answered: " + near.map(x => x.name).join(", ") + ". Are you one of them?";
  el.appendChild(q);
  near.forEach(n => {
    const b = document.createElement("button");
    b.textContent = "Yes, I'm " + n.name;
    b.onclick = () => { el.hidden = true; selectIdentity(n.name); };
    el.appendChild(b);
  });
  const no = document.createElement("button");
  no.className = "ghost";
  no.textContent = "No \u2014 I'm " + typed;
  no.onclick = () => { el.hidden = true; selectIdentity(typed); };
  el.appendChild(no);
  el.hidden = false;
  pendingConfirm = true;
  refreshBar();
}

$("whook").onclick = commitTypedName;
$("who").addEventListener("keydown", e => { if (e.key === "Enter") commitTypedName(); });

/* ---- views + edit mode ---- */
let view = "group";
function setView(v){
  if (editing && v!=="me") stopEditing();
  view = v;
  document.body.className = v;
  hideTip(); renderCells(); refreshBar(); setHint();
}
function startEditing(){
  if (norm($("who").value).length<2) return;
  editing = true; gridDirty = true;         // lock out poll reloads while editing
  vp.classList.add("editing");
  $("whorow").classList.add("locked");      // no swapping person mid-paint
  setView("me");
}
function stopEditing(){
  editing = false;
  vp.classList.remove("editing");
  $("whorow").classList.remove("locked");
  setHint();
}
/* Discard: drop any unsaved painting, restore the saved copy, stay on that person. */
function exitMe(){
  if (editing){ editing = false; vp.classList.remove("editing"); }
  $("whorow").classList.remove("locked");
  gridDirty = false; loadedFor = "";
  if (findResp(norm($("who").value))) maybeLoadMine(true); else clearSel();
  setView("me");
  renderWho();
}

/* Untapping the selected name goes back to everyone's overlay. */
function deselect(){
  picked = "";
  $("who").value = "";
  loadedFor = ""; gridDirty = false; clearSel();
  setView("group");
  renderWho();
}
$("discardbtn").onclick = exitMe;

function setHint(){
  $("hint").textContent =
    editing        ? "☝️ Paint your free slots · ✌️ Move / pinch" :
    picked         ? picked + "’s saved slots" :
                     "Brighter green = more people · Tap a slot to see who · Pinch to zoom";
}
function renderCells(){
  for (let r=0;r<NR;r++) for (let c=0;c<ND;c++){
    const el = cellEls[r*ND+c];
    if (view==="me"){
      el.classList.toggle("on", sel[c][r]);
      el.style.background=""; el.style.color=""; el.textContent="";
    } else {
      el.classList.remove("on");
      const n = counts.length ? counts[c][r].length : 0;
      const t = n/maxN;
      el.style.background = n ? `rgba(61,220,132,${(0.12 + 0.83*t).toFixed(3)})` : "";
      el.style.color = n && t>0.45 ? "#0b1020" : "";
      el.textContent = n || "";
    }
  }
}
function refreshBar(){
  const b=$("mainbtn"), cnt=$("count");
  const named = norm($("who").value).length>1;
  const d = $("discardbtn");
  if (pendingConfirm){            // don't let them submit under a name we just queried
    cnt.textContent = ""; d.hidden = true;
    b.hidden = false; b.disabled = true; b.textContent = "Confirm who you are";
    return;
  }
  if (editing){
    const total = sel.flat().filter(Boolean).length;
    cnt.textContent = total+" slot"+(total===1?"":"s");
    d.hidden = false;
    b.hidden = false; b.disabled = !named;
    b.textContent = total===0 ? "Submit — none work" : "Submit";
  } else {
    cnt.textContent = group.length+" response"+(group.length===1?"":"s");
    d.hidden = true;
    b.hidden = !picked;                       // nothing selected -> nothing to do
    b.disabled = !named;
    b.textContent = findResp(norm($("who").value)) ? "✏️ Edit availability"
                                                   : "＋ Add availability";
  }
}

/* ---- tooltip ---- */
let tipTimer=null;
function showTip(r,c){
  const names = counts.length ? counts[c][r] : [];
  const dt = new Date(CONFIG.dates[c]+"T12:00:00");
  const here = new Set(names.map(norm));
  const away = group.map(g => g.name).filter(n => !here.has(norm(n)));
  tip.innerHTML = `<b>${dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})} · ${label12(slotTime(r))}–${label12(slotTime(r+1))}</b>` +
    `<span class="yes">${names.length ? `${names.length}/${group.length}: ${names.join(", ")}` : "Nobody yet"}</span>` +
    (away.length ? `<span class="no">Not available: ${away.join(", ")}</span>` : "");
  tip.style.display="block";
  const x = TW + panX + c*CW + CW/2;
  const yTop = HH + panY + r*RH;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(6, x - tw/2), vpW - tw - 6);
  let top  = yTop - th - 8;
  if (top < HH + 4) top = yTop + RH + 8;          // no room above -> flip below
  top = Math.min(top, vpH - th - 6);              // ...and don't run off the bottom
  top = Math.max(HH + 4, top);
  tip.style.left = left+"px"; tip.style.top = top+"px";
  clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 3500);
}
function hideTip(){ tip.style.display="none"; clearTimeout(tipTimer); }

/* ---- selection ---- */
let dirty=false;
function setCell(r,c,v){
  if (r<0||r>=NR||c<0||c>=ND) return;
  if (sel[c][r]===v) return;
  sel[c][r]=v;
  cellEls[r*ND+c].classList.toggle("on", v);
  dirty=true; gridDirty=true;
}
function cellAt(clientX, clientY){
  const rect = vp.getBoundingClientRect();
  return { c: Math.floor((clientX-rect.left-TW-panX)/CW),
           r: Math.floor((clientY-rect.top -HH-panY)/RH) };
}
const inGrid = p => p.r>=0 && p.r<NR && p.c>=0 && p.c<ND;

/* ---- gestures ----
   editing : 1 finger paints / tap toggles ; 2 fingers pan+pinch
   viewing : 1 finger pans / tap = who's free ; 2 fingers pan+pinch */
let mode="idle", paintVal=true, startPt=null, lastCell=null, lastPan=null, lastDist=0, lastTouch=null;

function paintTo(r,c){
  if (!lastCell){ lastCell={r,c}; setCell(r,c,paintVal); return; }
  const steps = Math.max(Math.abs(r-lastCell.r), Math.abs(c-lastCell.c), 1);
  for (let i=1;i<=steps;i++)
    setCell(Math.round(lastCell.r+(r-lastCell.r)*i/steps),
            Math.round(lastCell.c+(c-lastCell.c)*i/steps), paintVal);
  lastCell={r,c};
}
function buzz(){ if (navigator.vibrate) try{navigator.vibrate(6);}catch(e){} }
function mid(ts){ let x=0,y=0; for (const t of ts){x+=t.clientX;y+=t.clientY;} return {x:x/ts.length,y:y/ts.length}; }
function dist(ts){ return ts.length<2 ? 0 : Math.hypot(ts[0].clientX-ts[1].clientX, ts[0].clientY-ts[1].clientY); }

vp.addEventListener("touchstart", e => {
  e.preventDefault(); hideTip();
  if (e.touches.length===1 && mode==="idle"){
    const t=e.touches[0];
    startPt={x:t.clientX,y:t.clientY}; lastTouch=startPt; mode="pending";
  } else if (e.touches.length>=2 && (mode==="idle"||mode==="pending"||mode==="pan1")){
    mode="pan"; lastPan=mid(e.touches); lastDist=dist(e.touches);
  }
}, {passive:false});

vp.addEventListener("touchmove", e => {
  e.preventDefault();
  if (mode==="pan"){
    const m=mid(e.touches), d=dist(e.touches);
    if (d && lastDist){
      /* pinch: zoom anchored at the old midpoint, then follow the new one */
      const [aZ,bZ]=zBounds();
      const zNew=Math.min(bZ,Math.max(aZ, Z*d/lastDist));
      const rect=vp.getBoundingClientRect();
      const ux=(lastPan.x-rect.left-TW-panX)/CW, uy=(lastPan.y-rect.top-HH-panY)/RH;
      Z=zNew; setSizes();
      panX=m.x-rect.left-TW-ux*CW; panY=m.y-rect.top-HH-uy*RH;
    } else {
      panX+=m.x-lastPan.x; panY+=m.y-lastPan.y;
    }
    lastPan=m; lastDist=d; clampPan(); applyPan();
    return;
  }
  const t=e.touches[0];
  const cur={x:t.clientX,y:t.clientY};
  if (mode==="pending" && Math.hypot(cur.x-startPt.x, cur.y-startPt.y) > 9){
    if (editing){
      const s=cellAt(startPt.x,startPt.y);
      if (!inGrid(s)){ mode="dead"; lastTouch=cur; return; }
      mode="paint"; paintVal=!sel[s.c][s.r]; lastCell=null;
      paintTo(s.r,s.c); buzz(); startAuto();
    } else {
      mode="pan1";
    }
  }
  if (mode==="paint"){ const p=cellAt(cur.x,cur.y); paintTo(p.r,p.c); }
  if (mode==="pan1"){
    panX+=cur.x-lastTouch.x; panY+=cur.y-lastTouch.y;
    clampPan(); applyPan();
  }
  lastTouch=cur;
}, {passive:false});

function endTouch(e){
  if (e.touches.length>0){
    if (mode==="pan"){ lastPan=mid(e.touches); lastDist=dist(e.touches);
      if (e.touches.length===1) mode="dead"; }
    return;
  }
  if (mode==="pending" && startPt){
    const p=cellAt(startPt.x,startPt.y);
    if (inGrid(p)){
      if (editing){ setCell(p.r,p.c,!sel[p.c][p.r]); buzz(); }
      else showTip(p.r,p.c);
    }
  }
  mode="idle"; startPt=null; lastCell=null; lastDist=0; stopAuto();
  if (dirty){ dirty=false; refreshBar(); }
}
vp.addEventListener("touchend", endTouch);
vp.addEventListener("touchcancel", endTouch);

/* auto-pan at edges while painting */
let autoT=null;
function startAuto(){
  if (autoT) return;
  autoT=setInterval(()=>{
    if (mode!=="paint"||!lastTouch) return;
    const r=vp.getBoundingClientRect();
    let dx=0,dy=0;
    if (lastTouch.y > r.bottom-56) dy=-9; else if (lastTouch.y < r.top+HH+40) dy=9;
    if (lastTouch.x > r.right-44)  dx=-9; else if (lastTouch.x < r.left+TW+30) dx=9;
    if (dx||dy){
      panX+=dx; panY+=dy; clampPan(); applyPan();
      const p=cellAt(lastTouch.x,lastTouch.y); paintTo(p.r,p.c);
    }
  },16);
}
function stopAuto(){ clearInterval(autoT); autoT=null; }

/* mouse: editing = drag paints · viewing = drag pans, click = who's free
   wheel pans · ctrl/cmd+wheel (trackpad pinch) zooms */
let mouseDown=false, mouseMoved=false, mStart=null;
vp.addEventListener("mousedown", e => {
  e.preventDefault(); hideTip();
  mStart={x:e.clientX,y:e.clientY}; mouseMoved=false; mouseDown=true;
  if (editing){
    const p=cellAt(e.clientX,e.clientY);
    if (!inGrid(p)){ mouseDown=false; return; }
    paintVal=!sel[p.c][p.r]; lastCell=null; paintTo(p.r,p.c);
  }
});
window.addEventListener("mousemove", e => {
  if (!mouseDown) return;
  if (Math.hypot(e.clientX-mStart.x, e.clientY-mStart.y)>4) mouseMoved=true;
  if (editing){ const p=cellAt(e.clientX,e.clientY); paintTo(p.r,p.c); }
  else { panX+=e.movementX; panY+=e.movementY; clampPan(); applyPan(); }
});
window.addEventListener("mouseup", e => {
  if (!mouseDown) return;
  mouseDown=false; lastCell=null;
  if (!editing && !mouseMoved){
    const p=cellAt(e.clientX,e.clientY);
    if (inGrid(p)) showTip(p.r,p.c);
  }
  refreshBar();
});
vp.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    zoomAt(Z * Math.exp(-e.deltaY/300), e.clientX, e.clientY);
  } else {
    panX-=e.deltaX; panY-=e.deltaY; clampPan(); applyPan();
  }
}, {passive:false});

/* ---- submit / edit button ---- */
$("mainbtn").onclick = async () => {
  if (!editing){ startEditing(); return; }
  const payload = {
    gig: CONFIG.gigId,
    name: $("who").value.trim(),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    submittedAt: new Date().toISOString(),
    slotMinutes: CONFIG.slotMinutes,
    availability: {}
  };
  CONFIG.dates.forEach((iso,c) => {
    const runs=[]; let s=null;
    for (let r=0;r<=NR;r++){
      if (sel[c][r] && s===null) s=r;
      else if (!sel[c][r] && s!==null){ runs.push(slotTime(s)+"-"+slotTime(r)); s=null; }
    }
    if (runs.length) payload.availability[iso]=runs;
  });
  const b=$("mainbtn");
  b.disabled=true; b.textContent="Sending…";
  try{
    const res = await fetch(POST_URL(), {method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)});
    if (!res.ok) throw new Error(res.status);
    setSync(true);
    loadedFor = norm(payload.name);
    gridDirty = false;
    stopEditing();
    b.textContent="✓ Saved";
    groupStamp="";
    await fetchData();
    setTimeout(deselect, 350);
  }catch(err){
    setSync(false);
    b.disabled=false; b.textContent="Retry — couldn't reach server";
  }
};

renderWho();

layout(); setView("group");
fetchData();
setInterval(fetchData, CONFIG.pollMs);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) fetchData(); });

}  /* end startApp */

boot();
</script>
</body>
</html>
