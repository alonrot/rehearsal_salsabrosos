<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rehearsal availability</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b30; --line:#222c4d; --line2:#32406b;
    --ink:#f2f4f8; --dim:#9fa9c4; --faint:#6b7694;
    --accent:#4257c9; --accent2:#5a6fe0;
    --sel:#2fbf71; --sel2:#53e193;
    --tw:62px; --hh:48px; --rh:30px; --cw:66px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none; position:fixed; inset:0;
  }
  #app{height:100%; height:100dvh; display:flex; flex-direction:column; max-width:900px; margin:0 auto;}

  /* ---------- top ---------- */
  #brand{flex:none; text-align:center; padding:10px 14px 2px;}
  #brand img{height:42px; max-width:92%; object-fit:contain; display:inline-block;}
  @media (max-height:460px){ #brand{display:none;} }
  #maracas{height:34px; flex:none; display:block;}
  #top{padding:8px 14px 8px; flex:none;}
  .row{display:flex; gap:8px; align-items:center;}
  input[type=text]{
    flex:1; min-width:0; padding:9px 12px; font-size:16px; border-radius:11px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
  }
  input[type=text]:focus{outline:none; border-color:var(--accent);}
  #views{display:flex; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px; gap:3px;}
  #views button{
    padding:7px 12px; border:0; border-radius:999px; background:transparent;
    color:var(--dim); font-size:13px; font-weight:600; font-family:inherit; white-space:nowrap;
  }
  #views button[aria-pressed=true]{background:var(--accent); color:#fff;}
  .hint{margin:7px 0 0; font-size:12px; color:var(--faint); display:flex; justify-content:space-between; gap:8px;}
  #sync{flex:none;}
  #sync.bad{color:#e8a53c;}

  /* ---------- grid viewport ---------- */
  #vp{
    position:relative; flex:1; min-height:0; overflow:hidden;
    touch-action:none; cursor:crosshair;
    border-top:1px solid var(--line);
    user-select:none; -webkit-user-select:none;
  }
  #vp.editing{box-shadow:inset 0 0 0 2px var(--sel);}
  #vp>div{position:absolute; will-change:transform;}
  #corner{left:0; top:0; width:var(--tw); height:var(--hh); z-index:3;
    background:var(--bg); border-right:1px solid var(--line2); border-bottom:1px solid var(--line2);}
  #dayhdr{left:var(--tw); top:0; height:var(--hh); z-index:2; display:flex;
    background:var(--bg); border-bottom:1px solid var(--line2);}
  .dh{width:var(--cw); flex:none; text-align:center; padding-top:7px; border-right:1px solid var(--line); overflow:hidden;}
  .dh b{display:block; font-size:13px; font-weight:650;}
  .dh span{font-size:11px; color:var(--faint);}
  #timecol{left:0; top:var(--hh); width:var(--tw); z-index:2;
    background:var(--bg); border-right:1px solid var(--line2);}
  .tl{height:var(--rh); font-size:11px; color:var(--dim); text-align:right;
      padding:2px 8px 0 0; font-variant-numeric:tabular-nums; overflow:hidden;}
  .tl.half{color:transparent;}
  #cells{left:var(--tw); top:var(--hh); z-index:1; display:grid;}
  .c{
    width:var(--cw); height:var(--rh);
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:rgba(242,244,248,.78); font-variant-numeric:tabular-nums;
    overflow:hidden;
  }
  .c.hr{border-top:1px solid var(--line2);}
  body.me .c.on{background:linear-gradient(180deg,var(--sel),var(--sel2));
    border-right-color:rgba(0,0,0,.25); border-bottom-color:rgba(0,0,0,.18); color:#0b1020;}

  /* tooltip */
  #tip{
    z-index:5; max-width:230px; padding:8px 11px; border-radius:11px;
    background:#242b3a; border:1px solid var(--line2); box-shadow:0 6px 24px rgba(0,0,0,.5);
    font-size:12.5px; line-height:1.45; color:var(--ink); pointer-events:none;
    display:none; will-change:auto;
  }
  #tip b{display:block; font-size:11.5px; color:var(--dim); margin-bottom:2px; font-weight:600;}

  /* ---------- bottom ---------- */
  #bot{flex:none; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--bg);}
  #count{font-size:13px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums;}
  #mainbtn{flex:1; padding:13px; border:0; border-radius:12px; font-size:15.5px; font-weight:650;
    font-family:inherit; background:var(--accent); color:#fff;}
  #mainbtn:disabled{background:#222c4d; color:var(--faint);}
  #nojs{padding:18px 16px; color:var(--dim); font-size:14px; line-height:1.5;}
</style>
</head>

const EXEC_URL = "https://script.google.com/macros/s/AKfycbxGwJZlvFDokPpRwFAD6d9rWfUGvqkPSHmrTnVjTxC7ZfcSbn13p11d-uIqhY_o8KgT/exec";

const CONFIG = {
  dates: [
    "2026-10-07","2026-10-10","2026-10-11",
    "2026-10-14","2026-10-17","2026-10-18",
    "2026-10-21","2026-10-24","2026-10-25",
    "2026-10-28","2026-10-31","2026-11-01"
  ],
  startHour: 9, endHour: 23, slotMinutes: 30,
  defaultDaysVisible: 5,     // default view: 5 columns ...
  defaultHoursVisible: 9,    // ... and 9am-6pm vertically
  zoomInDaysCap: 4,          // can't zoom in past ~4 visible days
  // LOCAL is computed just above: no editing this file between environments.
  apiBase: LOCAL ? "" : EXEC_URL,
  pollMs:  LOCAL ? 2000 : 8000   // Apps Script has daily quotas; don't poll it hard
};
/* =========================================================== */

const ND = CONFIG.dates.length;
const NR = ((CONFIG.endHour - CONFIG.startHour) * 60) / CONFIG.slotMinutes;
const sel = CONFIG.dates.map(() => new Array(NR).fill(false));

const pad = n => String(n).padStart(2,"0");
const slotTime = i => { const m = CONFIG.startHour*60 + i*CONFIG.slotMinutes; return pad(m/60|0)+":"+pad(m%60); };
const slotIdx = hhmm => { const [h,m]=hhmm.split(":").map(Number); return ((h*60+m)-CONFIG.startHour*60)/CONFIG.slotMinutes; };
const label12 = hhmm => { let [h,m]=hhmm.split(":").map(Number); const ap=h>=12?"pm":"am"; h=h%12||12; return m?`${h}:${pad(m)}${ap}`:`${h}${ap}`; };
const norm = s => s.trim().toLowerCase();

const $ = id => document.getElementById(id);
const vp=$("vp"), cellsEl=$("cells"), hdrEl=$("dayhdr"), tcolEl=$("timecol"), tip=$("tip");
$("nojs").remove();

/* ---- build DOM ---- */
CONFIG.dates.forEach(iso => {
  const dt = new Date(iso+"T12:00:00");
  const d = document.createElement("div");
  d.className = "dh";
  d.innerHTML = `<b>${dt.toLocaleDateString(undefined,{weekday:"short"})}</b><span>${dt.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>`;
  hdrEl.appendChild(d);
});
for (let r=0;r<NR;r++){
  const t = document.createElement("div");
  t.className = "tl" + (slotTime(r).endsWith(":00")?"":" half");
  t.textContent = label12(slotTime(r));
  tcolEl.appendChild(t);
}
const cellEls = [];
for (let r=0;r<NR;r++) for (let c=0;c<ND;c++){
  const el = document.createElement("div");
  el.className = "c" + (slotTime(r).endsWith(":00") && r ? " hr":"");
  cellsEl.appendChild(el);
  cellEls[r*ND+c] = el;
}
cellsEl.style.gridTemplateColumns = `repeat(${ND}, var(--cw))`;

/* ---- geometry: base sizes x zoom factor Z ---- */
let TW=62, HH=48, vpW=0, vpH=0;
let CW0=66, RH0=30, Z=1, CW=66, RH=30;
let panX=0, panY=0;
const rowsDefault = CONFIG.defaultHoursVisible*60/CONFIG.slotMinutes;

function zBounds(){
  const fitAllRows = (vpH-HH)/(NR*RH0);                     // zoom-out cap: whole time scale
  const zMin = Math.min(1, Math.max(fitAllRows, 34/CW0, 11/RH0, 0.3));
  const zMax = CONFIG.defaultDaysVisible/CONFIG.zoomInDaysCap; // zoom-in cap: ~4 days
  return [zMin, zMax];
}
function setSizes(){
  CW = CW0*Z; RH = RH0*Z;
  document.documentElement.style.setProperty("--cw", CW+"px");
  document.documentElement.style.setProperty("--rh", RH+"px");
}
function layout(){
  const r = vp.getBoundingClientRect(); vpW=r.width; vpH=r.height;
  CW0 = Math.max(58, (vpW-TW)/CONFIG.defaultDaysVisible);
  RH0 = Math.max(20, (vpH-HH)/rowsDefault);
  const [a,b]=zBounds(); Z=Math.min(b,Math.max(a,Z));
  setSizes(); clampPan(); applyPan();
}
function clampPan(){
  panX = Math.min(0, Math.max(vpW - TW - ND*CW, panX));
  panY = Math.min(0, Math.max(vpH - HH - NR*RH, panY));
  if (ND*CW <= vpW-TW) panX=0;
  if (NR*RH <= vpH-HH) panY=0;
}
function applyPan(){
  cellsEl.style.transform = `translate(${panX}px,${panY}px)`;
  hdrEl.style.transform   = `translateX(${panX}px)`;
  tcolEl.style.transform  = `translateY(${panY}px)`;
  hideTip();
}
/* zoom so the content point under (mx,my) stays put */
function zoomAt(zNew, mx, my){
  const [a,b]=zBounds(); zNew=Math.min(b,Math.max(a,zNew));
  if (zNew===Z) return;
  const rect=vp.getBoundingClientRect();
  const ux=(mx-rect.left-TW-panX)/CW, uy=(my-rect.top-HH-panY)/RH;
  Z=zNew; setSizes();
  panX = mx-rect.left-TW-ux*CW;
  panY = my-rect.top -HH-uy*RH;
  clampPan(); applyPan();
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout,120));
new ResizeObserver(layout).observe(vp);   // vp height changes without a window resize too

/* ---- data layer ---- */
let group = [];
let counts = [];
let groupStamp = "";
let maxN = 1;
const GET_URL  = () => CONFIG.apiBase ? CONFIG.apiBase : "data.json";
const POST_URL = () => CONFIG.apiBase ? CONFIG.apiBase : "submit";

function rebuildCounts(){
  counts = CONFIG.dates.map(()=>Array.from({length:NR},()=>[]));
  maxN = 1;
  for (const resp of group){
    const av = resp.availability || {};
    CONFIG.dates.forEach((iso,c) => {
      for (const rng of (av[iso]||[])){
        const [a,b] = rng.split("-");
        let r0 = Math.max(0, Math.floor(slotIdx(a)));
        let r1 = Math.min(NR, Math.ceil(slotIdx(b)));
        for (let r=r0; r<r1; r++){
          counts[c][r].push(resp.name);
          if (counts[c][r].length > maxN) maxN = counts[c][r].length;
        }
      }
    });
  }
}
async function fetchData(){
  if (document.hidden) return;
  try{
    const res = await fetch(GET_URL(), {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const stamp = JSON.stringify(data);
    setSync(true);
    if (stamp === groupStamp) return;
    groupStamp = stamp;
    group = data.responses || [];
    rebuildCounts();
    if (view==="group") renderCells();
    refreshBar();
    maybeLoadMine();
  }catch(err){ setSync(false); }
}
let online=null;
function setSync(ok){
  if (ok===online) return;
  online=ok;
  const s=$("sync");
  s.textContent = ok ? "" : "⚠ no server — nothing is saved";
  s.className = ok ? "" : "bad";
}

/* ---- my availability <-> name field ---- */
let loadedFor = "", gridDirty = false, editing = false;
const findResp = name => group.find(r => norm(r.name||"")===name);

function clearSel(){ for (const col of sel) col.fill(false); }

function maybeLoadMine(force){
  const name = norm($("who").value);
  if (!name || gridDirty || (name===loadedFor && !force)) return;
  const mine = findResp(name);
  if (!mine) return;
  loadedFor = name;
  clearSel();
  CONFIG.dates.forEach((iso,c) => {
    for (const rng of ((mine.availability||{})[iso]||[])){
      const [a,b] = rng.split("-");
      for (let r=Math.max(0,slotIdx(a)); r<Math.min(NR,slotIdx(b)); r++) sel[c][r]=true;
    }
  });
  gridDirty = false;
  if (view==="me") renderCells();
  refreshBar();
}

/* the moment the name stops matching anyone, show Everyone */
$("who").addEventListener("input", () => {
  refreshBar();
  if (editing) return;                      // never yank the grid mid-edit
  const name = norm($("who").value);
  if (name && findResp(name)){
    loadedFor=""; gridDirty=false; maybeLoadMine(true);
  } else {
    clearSel(); loadedFor=""; gridDirty=false;
    if (view!=="group") setView("group"); else renderCells();
    refreshBar();
  }
});

/* ---- views + edit mode ---- */
let view = "group";
function setView(v){
  if (editing && v!=="me") stopEditing();
  view = v;
  document.body.className = v;
  $("vMe").setAttribute("aria-pressed", v==="me");
  $("vGroup").setAttribute("aria-pressed", v==="group");
  hideTip(); renderCells(); refreshBar(); setHint();
}
function startEditing(){
  if (norm($("who").value).length<2) return;
  editing = true; gridDirty = true;         // lock out poll reloads while editing
  vp.classList.add("editing");
  setView("me");
}
function stopEditing(){
  editing = false;
  vp.classList.remove("editing");
  setHint();
}
$("vMe").onclick    = ()=>setView("me");
$("vGroup").onclick = ()=>setView("group");

function setHint(){
  $("hint").textContent =
    editing        ? "☝️ Paint your free slots · ✌️ Move / pinch" :
    view==="group" ? "Brighter green = more people · Tap a slot to see who · Pinch to zoom" :
                     "Your saved availability · tap ✏️ to change it";
}
function renderCells(){
  for (let r=0;r<NR;r++) for (let c=0;c<ND;c++){
    const el = cellEls[r*ND+c];
    if (view==="me"){
      el.classList.toggle("on", sel[c][r]);
      el.style.background=""; el.style.color=""; el.textContent="";
    } else {
      el.classList.remove("on");
      const n = counts.length ? counts[c][r].length : 0;
      const t = n/maxN;
      el.style.background = n ? `rgba(61,220,132,${(0.12 + 0.83*t).toFixed(3)})` : "";
      el.style.color = n && t>0.45 ? "#0b1020" : "";
      el.textContent = n || "";
    }
  }
}
function refreshBar(){
  const b=$("mainbtn"), cnt=$("count");
  const named = norm($("who").value).length>1;
  if (editing){
    const total = sel.flat().filter(Boolean).length;
    cnt.textContent = total+" slot"+(total===1?"":"s");
    b.disabled = !named;
    b.textContent = !named ? "Enter your name first"
      : total===0 ? "Submit — none of these work" : "Submit";
  } else {
    cnt.textContent = group.length+" response"+(group.length===1?"":"s");
    b.disabled = !named;
    b.textContent = named ? "✏️ Edit my availability" : "Enter your name to add yours";
  }
}

/* ---- tooltip ---- */
let tipTimer=null;
function showTip(r,c){
  const names = counts.length ? counts[c][r] : [];
  const dt = new Date(CONFIG.dates[c]+"T12:00:00");
  tip.innerHTML = `<b>${dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})} · ${label12(slotTime(r))}–${label12(slotTime(r+1))}</b>` +
    (names.length ? `${names.length}/${group.length}: ${names.join(", ")}` : "Nobody yet");
  tip.style.display="block";
  const x = TW + panX + c*CW + CW/2;
  const yTop = HH + panY + r*RH;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(6, x - tw/2), vpW - tw - 6);
  let top  = yTop - th - 8;
  if (top < HH + 4) top = yTop + RH + 8;
  tip.style.left = left+"px"; tip.style.top = top+"px";
  clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 3500);
}
function hideTip(){ tip.style.display="none"; clearTimeout(tipTimer); }

/* ---- selection ---- */
let dirty=false;
function setCell(r,c,v){
  if (r<0||r>=NR||c<0||c>=ND) return;
  if (sel[c][r]===v) return;
  sel[c][r]=v;
  cellEls[r*ND+c].classList.toggle("on", v);
  dirty=true; gridDirty=true;
}
function cellAt(clientX, clientY){
  const rect = vp.getBoundingClientRect();
  return { c: Math.floor((clientX-rect.left-TW-panX)/CW),
           r: Math.floor((clientY-rect.top -HH-panY)/RH) };
}
const inGrid = p => p.r>=0 && p.r<NR && p.c>=0 && p.c<ND;

/* ---- gestures ----
   editing : 1 finger paints / tap toggles ; 2 fingers pan+pinch
   viewing : 1 finger pans / tap = who's free ; 2 fingers pan+pinch */
let mode="idle", paintVal=true, startPt=null, lastCell=null, lastPan=null, lastDist=0, lastTouch=null;

function paintTo(r,c){
  if (!lastCell){ lastCell={r,c}; setCell(r,c,paintVal); return; }
  const steps = Math.max(Math.abs(r-lastCell.r), Math.abs(c-lastCell.c), 1);
  for (let i=1;i<=steps;i++)
    setCell(Math.round(lastCell.r+(r-lastCell.r)*i/steps),
            Math.round(lastCell.c+(c-lastCell.c)*i/steps), paintVal);
  lastCell={r,c};
}
function buzz(){ if (navigator.vibrate) try{navigator.vibrate(6);}catch(e){} }
function mid(ts){ let x=0,y=0; for (const t of ts){x+=t.clientX;y+=t.clientY;} return {x:x/ts.length,y:y/ts.length}; }
function dist(ts){ return ts.length<2 ? 0 : Math.hypot(ts[0].clientX-ts[1].clientX, ts[0].clientY-ts[1].clientY); }

vp.addEventListener("touchstart", e => {
  e.preventDefault(); hideTip();
  if (e.touches.length===1 && mode==="idle"){
    const t=e.touches[0];
    startPt={x:t.clientX,y:t.clientY}; lastTouch=startPt; mode="pending";
  } else if (e.touches.length>=2 && (mode==="idle"||mode==="pending"||mode==="pan1")){
    mode="pan"; lastPan=mid(e.touches); lastDist=dist(e.touches);
  }
}, {passive:false});

vp.addEventListener("touchmove", e => {
  e.preventDefault();
  if (mode==="pan"){
    const m=mid(e.touches), d=dist(e.touches);
    if (d && lastDist){
      /* pinch: zoom anchored at the old midpoint, then follow the new one */
      const [aZ,bZ]=zBounds();
      const zNew=Math.min(bZ,Math.max(aZ, Z*d/lastDist));
      const rect=vp.getBoundingClientRect();
      const ux=(lastPan.x-rect.left-TW-panX)/CW, uy=(lastPan.y-rect.top-HH-panY)/RH;
      Z=zNew; setSizes();
      panX=m.x-rect.left-TW-ux*CW; panY=m.y-rect.top-HH-uy*RH;
    } else {
      panX+=m.x-lastPan.x; panY+=m.y-lastPan.y;
    }
    lastPan=m; lastDist=d; clampPan(); applyPan();
    return;
  }
  const t=e.touches[0];
  const cur={x:t.clientX,y:t.clientY};
  if (mode==="pending" && Math.hypot(cur.x-startPt.x, cur.y-startPt.y) > 9){
    if (editing){
      const s=cellAt(startPt.x,startPt.y);
      if (!inGrid(s)){ mode="dead"; lastTouch=cur; return; }
      mode="paint"; paintVal=!sel[s.c][s.r]; lastCell=null;
      paintTo(s.r,s.c); buzz(); startAuto();
    } else {
      mode="pan1";
    }
  }
  if (mode==="paint"){ const p=cellAt(cur.x,cur.y); paintTo(p.r,p.c); }
  if (mode==="pan1"){
    panX+=cur.x-lastTouch.x; panY+=cur.y-lastTouch.y;
    clampPan(); applyPan();
  }
  lastTouch=cur;
}, {passive:false});

function endTouch(e){
  if (e.touches.length>0){
    if (mode==="pan"){ lastPan=mid(e.touches); lastDist=dist(e.touches);
      if (e.touches.length===1) mode="dead"; }
    return;
  }
  if (mode==="pending" && startPt){
    const p=cellAt(startPt.x,startPt.y);
    if (inGrid(p)){
      if (editing){ setCell(p.r,p.c,!sel[p.c][p.r]); buzz(); }
      else showTip(p.r,p.c);
    }
  }
  mode="idle"; startPt=null; lastCell=null; lastDist=0; stopAuto();
  if (dirty){ dirty=false; refreshBar(); }
}
vp.addEventListener("touchend", endTouch);
vp.addEventListener("touchcancel", endTouch);

/* auto-pan at edges while painting */
let autoT=null;
function startAuto(){
  if (autoT) return;
  autoT=setInterval(()=>{
    if (mode!=="paint"||!lastTouch) return;
    const r=vp.getBoundingClientRect();
    let dx=0,dy=0;
    if (lastTouch.y > r.bottom-56) dy=-9; else if (lastTouch.y < r.top+HH+40) dy=9;
    if (lastTouch.x > r.right-44)  dx=-9; else if (lastTouch.x < r.left+TW+30) dx=9;
    if (dx||dy){
      panX+=dx; panY+=dy; clampPan(); applyPan();
      const p=cellAt(lastTouch.x,lastTouch.y); paintTo(p.r,p.c);
    }
  },16);
}
function stopAuto(){ clearInterval(autoT); autoT=null; }

/* mouse: editing = drag paints · viewing = drag pans, click = who's free
   wheel pans · ctrl/cmd+wheel (trackpad pinch) zooms */
let mouseDown=false, mouseMoved=false, mStart=null;
vp.addEventListener("mousedown", e => {
  e.preventDefault(); hideTip();
  mStart={x:e.clientX,y:e.clientY}; mouseMoved=false; mouseDown=true;
  if (editing){
    const p=cellAt(e.clientX,e.clientY);
    if (!inGrid(p)){ mouseDown=false; return; }
    paintVal=!sel[p.c][p.r]; lastCell=null; paintTo(p.r,p.c);
  }
});
window.addEventListener("mousemove", e => {
  if (!mouseDown) return;
  if (Math.hypot(e.clientX-mStart.x, e.clientY-mStart.y)>4) mouseMoved=true;
  if (editing){ const p=cellAt(e.clientX,e.clientY); paintTo(p.r,p.c); }
  else { panX+=e.movementX; panY+=e.movementY; clampPan(); applyPan(); }
});
window.addEventListener("mouseup", e => {
  if (!mouseDown) return;
  mouseDown=false; lastCell=null;
  if (!editing && !mouseMoved){
    const p=cellAt(e.clientX,e.clientY);
    if (inGrid(p)) showTip(p.r,p.c);
  }
  refreshBar();
});
vp.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    zoomAt(Z * Math.exp(-e.deltaY/300), e.clientX, e.clientY);
  } else {
    panX-=e.deltaX; panY-=e.deltaY; clampPan(); applyPan();
  }
}, {passive:false});

/* ---- submit / edit button ---- */
$("mainbtn").onclick = async () => {
  if (!editing){ startEditing(); return; }
  const payload = {
    name: $("who").value.trim(),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    submittedAt: new Date().toISOString(),
    slotMinutes: CONFIG.slotMinutes,
    availability: {}
  };
  CONFIG.dates.forEach((iso,c) => {
    const runs=[]; let s=null;
    for (let r=0;r<=NR;r++){
      if (sel[c][r] && s===null) s=r;
      else if (!sel[c][r] && s!==null){ runs.push(slotTime(s)+"-"+slotTime(r)); s=null; }
    }
    if (runs.length) payload.availability[iso]=runs;
  });
  const b=$("mainbtn");
  b.disabled=true; b.textContent="Sending…";
  try{
    const res = await fetch(POST_URL(), {method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)});
    if (!res.ok) throw new Error(res.status);
    setSync(true);
    loadedFor = norm(payload.name);
    gridDirty = false;
    stopEditing();
    b.textContent="✓ Saved";
    groupStamp="";
    await fetchData();
    setTimeout(()=>setView("group"), 350);
  }catch(err){
    setSync(false);
    b.disabled=false; b.textContent="Retry — couldn't reach server";
  }
};

layout(); setView("group");
fetchData();
setInterval(fetchData, CONFIG.pollMs);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) fetchData(); });
</script>
</body>
</html>
